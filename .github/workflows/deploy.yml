name: CI/CD Backend Deploy to VPS with K8s

on:
  push:
   branches:
    - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USER }}/vellozap-food-service:${{ github.sha }}
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Prepare kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p $HOME/.kube
          echo "$KUBECONFIG_DATA" | base64 --decode > $HOME/.kube/config

      - name: Criar namespace se não existir
        run: |
          kubectl get namespace vellozap-food || kubectl create namespace vellozap-food

      - name: Criar/atualizar secret no cluster
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
            JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
            EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
            EVOLUTION_WEBHOOK_SECRET: ${{ secrets.EVOLUTION_WEBHOOK_SECRET }}
            N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}

        run: |
          kubectl create secret generic vellozap-food-service-secret -n vellozap-food \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=DATABASE_CA_CERT="${DATABASE_CA_CERT}" \
            --from-literal=JWT_ACCESS_SECRET="${JWT_ACCESS_SECRET}" \
            --from-literal=EVOLUTION_API_KEY="${EVOLUTION_API_KEY}" \
            --from-literal=EVOLUTION_WEBHOOK_SECRET="${EVOLUTION_WEBHOOK_SECRET}" \
            --from-literal=N8N_WEBHOOK_SECRET="${N8N_WEBHOOK_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Replace image placeholder
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USER }}/vellozap-food-service:${{ github.sha }}
          sed -i "s|REPLACE_IMAGE|${IMAGE_NAME}|g" k8s/deployment.yaml

      - name: kubectl apply
        run: |
          kubectl apply -k k8s

      # ---------------------------------------------------------------------
      # DB MIGRATIONS — NOT run automatically. The migrate-job.yaml stays
      # commented out in k8s/kustomization.yaml on purpose (Supabase pooler +
      # baseline-stamping). To run migrations for a release, render the Job with
      # the freshly built image and apply it manually, e.g.:
      #
      #   IMAGE_NAME=${{ secrets.DOCKERHUB_USER }}/vellozap-food-service:<sha>
      #   sed "s|REPLACE_IMAGE|${IMAGE_NAME}|g" k8s/migrate-job.yaml \
      #     | kubectl apply -n vellozap-food -f -
      #   kubectl wait --for=condition=complete --timeout=180s \
      #     job/vellozap-food-service-migrate -n vellozap-food
      #
      # Ensure the first migration (Baseline) is already STAMPED via
      # `npm run db:baseline` before the very first run.
      # ---------------------------------------------------------------------
