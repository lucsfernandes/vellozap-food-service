apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: arcobatrox

resources:
  - namespace.yaml
  - configmap.yaml
  # - secret.yaml          # vellozap-food-service-secret — apply out of band (sealed-secret / SOPS / external-secrets)
  - deployment.yaml
  - service.yaml
  - certificate.yaml
  - vellozap-food-middlewares.yaml
  - ingress-route.yaml
  - hpa.yaml
  - networkpolicy.yaml
  # - migrate-job.yaml     # apply per-release after schema changes (kubectl wait --for=condition=complete)
