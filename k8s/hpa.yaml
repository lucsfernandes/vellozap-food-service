apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vellozap-food-service-hpa
  namespace: vellozap-food
  labels:
    app.kubernetes.io/name: vellozap-food-service
    app.kubernetes.io/part-of: arcobatrox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vellozap-food-service
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
