apiVersion: v1
kind: ConfigMap
metadata:
  name: vellozap-food-service-config
  namespace: vellozap-food
  labels:
    app.kubernetes.io/name: vellozap-food-service
    app.kubernetes.io/part-of: arcobatrox
data:
  NODE_ENV: "production"
  PORT: "3333"
  API_PREFIX: "/api"
  # Public frontend origin allowed by CORS (credentials are used).
  # ADJUST to your real frontend host.
  CORS_ORIGIN: "https://vellozap-food.arcobatrox.com.br"
  # Number of reverse-proxy hops in front of the app (Traefik = 1).
  TRUST_PROXY: "1"

  # Rate limiting (auth routes)
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_LOGIN_MAX: "10"
  RATE_LIMIT_REFRESH_MAX: "30"

  # Database (Supabase pooler). The connection STRING with credentials lives in
  # the Secret as DATABASE_URL — only the non-sensitive toggles are here.
  DATABASE_SSL: "true"
  DB_LOGGING: "false"

  # Auth / JWT (non-sensitive). JWT_ACCESS_SECRET lives in the Secret.
  JWT_ISSUER: "vellozap-food"
  JWT_AUDIENCE: "vellozap-food-frontend"
  ACCESS_TTL: "15m"
  REFRESH_TTL: "30d"

  # Argon2
  ARGON_MEMORY_COST: "19456"
  ARGON_TIME_COST: "2"
  ARGON_PARALLELISM: "1"

  # WhatsApp (non-sensitive). API keys / webhook secrets live in the Secret.
  WHATSAPP_PROVIDER: "evolution"
  EVOLUTION_API_URL: "https://api.evolution.arcobatrox.com.br"
  EVOLUTION_INSTANCE: "Arcobatrox Tech"
  N8N_WEBHOOK_URL: "https://webhook.n8n.arcobatrox.com.br/webhook/vellozap-food"

  # Storage (logo/images). With the read-only rootfs + /tmp emptyDir, the local
  # driver is ephemeral; switch to "supabase"/"s3" for durable uploads in prod.
  STORAGE_DRIVER: "local"
  STORAGE_LOCAL_DIR: "/tmp/uploads"
  STORAGE_PUBLIC_BASE_URL: "https://api.vellozap-food.arcobatrox.com.br/uploads"

  # External
  VIACEP_BASE_URL: "https://viacep.com.br/ws"
